version: "3.9"

services:
  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/frontend.Dockerfile
    image: hackathon-template/frontend:latest
    container_name: hackathon-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}

  backend:
    build:
      context: ..
      dockerfile: deployment/docker/backend.Dockerfile
    image: hackathon-template/backend:latest
    container_name: hackathon-backend
    ports:
      - "4000:4000"

  ai-service:
    build:
      context: ..
      dockerfile: deployment/docker/ai-service.Dockerfile
    image: hackathon-template/ai-service:latest
    container_name: hackathon-ai-service
    ports:
      - "5000:5000"
